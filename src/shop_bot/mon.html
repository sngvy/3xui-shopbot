<style>
/* Дизайн-токены (Material 3 Expressive) */
:root{
  color-scheme: light dark;

  /* Цвета */
  --surface:#FBF8FF;
  --surface-container:#EFEDF4;
  --surface-container-high:#E9E7EF;
  --surface-container-highest:#E4E1E9;
  --on-surface:#1B1B21;
  --on-surface-variant:#454651;
  --outline-variant:#C6C5D3;

  --primary:#344DDB;
  --on-primary:#FFFFFF;
  --primary-container:#DEE0FF;
  --on-primary-container:#000F5D;

  --secondary:#765376;
  --on-secondary:#FFFFFF;
  --secondary-container:#FFD6FC;
  --on-secondary-container:#2D102F;

  --tertiary:#476646;
  --on-tertiary:#FFFFFF;
  --tertiary-container:#C8ECC3;
  --on-tertiary-container:#032108;

  --amber:#84531E;
  --amber-container:#FFDCBF;
  --on-amber-container:#2D1600;

  --error:#A43B33;
  --error-container:#FFDAD6;
  --on-error-container:#410002;

  --online:#2E6955;
  --online-container:#B3EFD6;
  --online-glow:rgba(46,105,85,.45);

  --scrim:rgba(27,27,33,.10);

  /* Скругления */
  --r-xs:8px;  --r-s:12px;  --r-m:16px;
  --r-l:24px;  --r-xl:28px; --r-xxl:36px; --r-full:999px;

  /* Анимации */
  --ease-emph:cubic-bezier(.2,0,0,1);
  --ease-spring:cubic-bezier(.34,1.42,.5,1);
  --dur-short:180ms;
  --dur-med:380ms;
  --dur-long:520ms;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#131318;
    --surface-container:#1F1F25;
    --surface-container-high:#29292F;
    --surface-container-highest:#34343A;
    --on-surface:#E4E1E9;
    --on-surface-variant:#C6C5D3;
    --outline-variant:#454651;

    --primary:#BBC3FF;
    --on-primary:#001D93;
    --primary-container:#1030C4;
    --on-primary-container:#DEE0FF;

    --secondary:#E4B9E2;
    --on-secondary:#442545;
    --secondary-container:#5C3B5D;
    --on-secondary-container:#FFD6FC;

    --tertiary:#ACD0A9;
    --on-tertiary:#19371B;
    --tertiary-container:#2F4E30;
    --on-tertiary-container:#C8ECC3;

    --amber:#FBB97B;
    --amber-container:#683C07;
    --on-amber-container:#FFDCBF;

    --error:#FFB4AB;
    --error-container:#84241E;
    --on-error-container:#FFDAD6;

    --online:#97D3BB;
    --online-container:#11503E;
    --online-glow:rgba(151,211,187,.40);

    --scrim:rgba(0,0,0,.35);
  }
}

*{margin:0;padding:0;box-sizing:border-box;}

html{-webkit-text-size-adjust:100%;}

body{
  font-family:"Unbounded",system-ui,sans-serif;
  background:var(--surface);
  color:var(--on-surface);
  min-height:100vh;
  min-height:100dvh;
  padding:20px 16px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  -webkit-font-smoothing:antialiased;
}

::selection{background:var(--primary-container);color:var(--on-primary-container);}

:focus-visible{
  outline:3px solid var(--primary);
  outline-offset:2px;
  border-radius:var(--r-xs);
}

/* Типографика */
.display{
  font-family:"Unbounded",sans-serif;
  font-weight:800;
  font-size:clamp(2.1rem,10vw,3.4rem);
  line-height:1.02;
  letter-spacing:-.03em;
  color:var(--on-surface);
}
.display em{font-style:normal;color:var(--primary);}

.headline{
  font-size:1.2rem;
  font-weight:500;
  letter-spacing:-.02em;
  line-height:1.25;
}

.body{
  font-size:.82rem;
  line-height:1.65;
  letter-spacing:-.01em;
  color:var(--on-surface-variant);
  font-weight:300;
}

.label{
  font-size:.62rem;
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--on-surface-variant);
}

.data{font-variant-numeric:tabular-nums;}

.section-title{
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--on-surface-variant);
  margin:32px 4px 12px;
  display:flex;
  align-items:center;
  gap:10px;
}
.section-title::after{
  content:"";
  flex:1;
  height:2px;
  border-radius:2px;
  background:var(--outline-variant);
}

.msym{
  font-family:"Material Symbols Rounded";
  font-weight:400;
  font-style:normal;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  direction:ltr;
  font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24;
  -webkit-font-feature-settings:"liga";
  font-feature-settings:"liga";
  -webkit-font-smoothing:antialiased;
  user-select:none;
}

/* Раскладка */
.shell{width:100%;max-width:560px;display:flex;flex-direction:column;}

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}
.brandmark{
  width:40px;height:40px;
  display:grid;place-items:center;
  background:var(--primary);
  color:var(--on-primary);
  border-radius:14px 20px 14px 20px;
  flex-shrink:0;
}
.brandmark .msym{font-size:22px;}
.brandname{
  font-size:.66rem;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--on-surface-variant);
}

/* Карточки */
.card{
  background:var(--surface-container);
  border-radius:var(--r-xl);
  padding:20px;
}
.card + .card{margin-top:12px;}

/* Плитки статуса */
.tiles{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.tile{
  border-radius:var(--r-l);
  padding:16px 16px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height:96px;
  justify-content:space-between;
  transition:border-radius var(--dur-med) var(--ease-spring);
}
.tile:nth-child(1){border-radius:var(--r-xxl) var(--r-l) var(--r-l) var(--r-l);}
.tile:nth-child(2){border-radius:var(--r-l) var(--r-xxl) var(--r-l) var(--r-l);}
.tile:nth-child(3){border-radius:var(--r-l) var(--r-l) var(--r-l) var(--r-xxl);}
.tile:nth-child(4){border-radius:var(--r-l) var(--r-l) var(--r-xxl) var(--r-l);}
.tile .msym{font-size:22px;}
.tile-key{font-size:.6rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.75;}
.tile-val{font-size:.92rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;}

.t-primary{background:var(--primary-container);color:var(--on-primary-container);}
.t-secondary{background:var(--secondary-container);color:var(--on-secondary-container);}
.t-tertiary{background:var(--tertiary-container);color:var(--on-tertiary-container);}
.t-amber{background:var(--amber-container);color:var(--on-amber-container);}
.t-online{background:var(--online-container);color:var(--on-tertiary-container);}
.t-error{background:var(--error-container);color:var(--on-error-container);}

/* Кнопки */
.btn{
  -webkit-tap-highlight-color:transparent;
  appearance:none;
  border:none;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 24px;
  font-family:inherit;
  font-size:.82rem;
  font-weight:500;
  letter-spacing:0;
  text-decoration:none;
  border-radius:var(--r-xl);
  background:var(--primary);
  color:var(--on-primary);
  transition:border-radius var(--dur-med) var(--ease-spring),
             transform var(--dur-short) var(--ease-emph),
             filter var(--dur-short) var(--ease-emph);
}
.btn .msym{font-size:20px;}
.btn:hover{filter:brightness(1.06);}
/* При нажатии кнопка сжимается и меняет форму */
.btn:active{border-radius:var(--r-m);transform:scale(.96);}

.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container);}
.btn-full{width:100%;}

/* Группа связанных кнопок */
.group{display:grid;gap:4px;}
.group.cols-2{grid-template-columns:1fr 1fr;}
.group.cols-1{grid-template-columns:1fr;}
.chipbtn{
  -webkit-tap-highlight-color:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  text-decoration:none;
  padding:14px 8px;
  font-size:.7rem;
  font-weight:500;
  letter-spacing:0;
  background:var(--surface-container-high);
  color:var(--on-surface);
  border-radius:var(--r-xs);
  transition:border-radius var(--dur-med) var(--ease-spring),
             background var(--dur-short) var(--ease-emph),
             transform var(--dur-short) var(--ease-emph);
}
.chipbtn .msym{font-size:18px;opacity:.75;}
.chipbtn:hover{background:var(--surface-container-highest);}
.chipbtn:active{border-radius:var(--r-l);transform:scale(.97);}
.group.cols-2 > .chipbtn:first-child{border-top-left-radius:var(--r-l);border-bottom-left-radius:var(--r-l);}
.group.cols-2 > .chipbtn:last-child{border-top-right-radius:var(--r-l);border-bottom-right-radius:var(--r-l);}
.group.cols-1 > .chipbtn{border-radius:var(--r-l);}
.chipbtn.accent{background:var(--primary-container);color:var(--on-primary-container);font-weight:600;}
.chipbtn.accent .msym{opacity:1;}

/* Чип */
.chip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px 8px 12px;
  border-radius:var(--r-full);
  background:var(--surface-container-high);
  color:var(--on-surface-variant);
  font-size:.66rem;
  font-weight:400;
  letter-spacing:.01em;
  max-width:100%;
}
.chip .msym{font-size:16px;}
.chip .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* Индикатор */
.led{
  width:10px;height:10px;border-radius:50%;
  background:var(--on-surface-variant);
  flex-shrink:0;
  opacity:.4;
  animation:led-wait 1.4s var(--ease-emph) infinite;
}
.led.on{background:var(--online);opacity:1;animation:led-pulse 2.4s var(--ease-emph) infinite;}
.led.off{background:var(--error);opacity:1;animation:none;}
@keyframes led-wait{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:.6;transform:scale(1);}}
@keyframes led-pulse{
  0%{box-shadow:0 0 0 0 var(--online-glow);}
  70%{box-shadow:0 0 0 9px transparent;}
  100%{box-shadow:0 0 0 0 transparent;}
}

/* Волнистый прогресс-бар */
.wavy{width:100%;height:auto;display:block;overflow:visible;}
.wavy .track{stroke:var(--outline-variant);stroke-width:7;stroke-linecap:round;fill:none;}
.wavy .wave{stroke:var(--primary);stroke-width:7;stroke-linecap:round;fill:none;
  animation:wave-flow 2.2s linear infinite;}
.wavy .cap{fill:var(--primary);}
@keyframes wave-flow{from{transform:translateX(0);}to{transform:translateX(-40px);}}

/* Подвал */
.foot{
  margin-top:36px;
  text-align:center;
  font-size:.6rem;
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--on-surface-variant);
  opacity:.5;
}

/* Экран загрузки */
#page-loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:18px;
  justify-content:center;
  align-items:center;
  background:var(--surface);
  transition:opacity var(--dur-med) var(--ease-emph);
}
#page-loader.hidden{opacity:0;pointer-events:none;}

.m3-loader{
  width:56px;height:56px;
  color:var(--primary);
  animation:m3-spin 4.9s cubic-bezier(.4,0,.2,1) infinite;
}
.m3-loader path{fill:currentColor;}
@keyframes m3-spin{
  0%{transform:rotate(0deg);}
  14.28%{transform:rotate(51.4deg);}
  28.57%{transform:rotate(102.8deg);}
  42.85%{transform:rotate(154.2deg);}
  57.14%{transform:rotate(205.7deg);}
  71.42%{transform:rotate(257.1deg);}
  85.71%{transform:rotate(308.5deg);}
  100%{transform:rotate(360deg);}
}
.m3-loader.contained{
  background:var(--primary-container);
  border-radius:var(--r-full);
  padding:0;
  animation:none;
}
.m3-loader-wrap{
  display:grid;place-items:center;
  width:76px;height:76px;
  border-radius:var(--r-full);
  background:var(--primary-container);
}

.loader-hint{
  font-size:.62rem;
  font-weight:500;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--on-surface-variant);
  opacity:.6;
}

body.loading .shell,
body.loading .foot{visibility:hidden;}

/* Появление контента */
.reveal{animation:reveal var(--dur-long) var(--ease-emph) both;}
@keyframes reveal{from{opacity:0;transform:translateY(18px) scale(.985);}to{opacity:1;transform:none;}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  .m3-loader{animation:none;}
}

/* Страница статуса */
.lead{margin:16px 0 24px;max-width:44ch;}

.summary{
  background:var(--primary-container);
  color:var(--on-primary-container);
  border-radius:var(--r-xxl) var(--r-l) var(--r-xxl) var(--r-l);
  padding:22px 22px 20px;
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:12px;
}
.summary-num{
  font-family:"Unbounded",sans-serif;
  font-weight:800;
  font-size:2.6rem;
  line-height:1;
  letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;
}
.summary-txt{font-size:.8rem;font-weight:500;line-height:1.4;letter-spacing:-.01em;}
.summary-sub{font-size:.62rem;font-weight:300;opacity:.75;margin-top:4px;letter-spacing:-.01em;}

.nodes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.node{
  background:var(--surface-container);
  color:var(--on-surface);
  border-radius:var(--r-s);
  padding:15px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  transition:background var(--dur-med) var(--ease-emph),
             color var(--dur-med) var(--ease-emph),
             border-radius var(--dur-med) var(--ease-spring);
}
.node-name{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:500;letter-spacing:.01em;}
.latency{font-size:.62rem;font-weight:400;font-variant-numeric:tabular-nums;opacity:.7;}
.node.up{background:var(--online-container);color:var(--on-tertiary-container);border-radius:var(--r-l);}
.node.down{background:var(--error-container);color:var(--on-error-container);border-radius:var(--r-l);}
.nodes > .node:first-child{border-top-left-radius:var(--r-xl);}
.nodes > .node:nth-child(2){border-top-right-radius:var(--r-xl);}
.nodes > .node:nth-last-child(2){border-bottom-left-radius:var(--r-xl);}
.nodes > .node:last-child{border-bottom-right-radius:var(--r-xl);}

.cta{margin-top:28px;}

@media (max-width:380px){
  .node{padding:13px 12px;}
  .node-name{font-size:.76rem;gap:8px;}
}
/* Фон: dotglobe */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.shell,.foot{position:relative;z-index:1;}
body{overflow-x:hidden;}
.bg::before,.bg::after{content:"";position:absolute;}
@media (prefers-reduced-motion: reduce){.bg *,.bg::before,.bg::after{animation:none !important;}}

.bg svg{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;translate:-50% -50%;}
.bg{--ln:#344DDB;--ln2:#765376;--g1:#344DDB;--g2:#765376;--g3:#765376;--bc:#C7D0FF;--be:#EEF0FF;}
@media (prefers-color-scheme: dark){.bg{--ln:#BBC3FF;--ln2:#E4B9E2;--g1:#BBC3FF;--g2:#E4B9E2;--g3:#E4B9E2;--bc:#4B5FF0;--be:#1F2F72;}}
.bg svg{left:0;top:0;width:100%;height:100%;translate:none;}
.bg canvas{opacity:1;}
/* Слой поверх фона: белый 50% (светлая тема) / чёрный 50% (тёмная) */
.bg{--veil:#ffffff;}
@media (prefers-color-scheme: dark){.bg{--veil:#000000;}}
.bg::after{inset:0;background:var(--veil);opacity:.5;}

/* Непрозрачность плиток, строк списков и кнопок — 75% */
.tile.t-primary{background:color-mix(in srgb,var(--primary-container) 75%,transparent);}
.tile.t-secondary{background:color-mix(in srgb,var(--secondary-container) 75%,transparent);}
.tile.t-tertiary{background:color-mix(in srgb,var(--tertiary-container) 75%,transparent);}
.tile.t-amber{background:color-mix(in srgb,var(--amber-container) 75%,transparent);}
.tile.t-online{background:color-mix(in srgb,var(--online-container) 75%,transparent);}
.tile.t-error{background:color-mix(in srgb,var(--error-container) 75%,transparent);}
.summary{background:color-mix(in srgb,var(--primary-container) 75%,transparent);}
.node{background:color-mix(in srgb,var(--surface-container) 75%,transparent);}
.node.up{background:color-mix(in srgb,var(--online-container) 75%,transparent);}
.node.down{background:color-mix(in srgb,var(--error-container) 75%,transparent);}
.btn{background:color-mix(in srgb,var(--primary) 75%,transparent);}
.btn.btn-tonal{background:color-mix(in srgb,var(--secondary-container) 75%,transparent);}
.card{background:color-mix(in srgb,var(--surface-container) 75%,transparent);}
.brandmark{background:color-mix(in srgb,var(--primary) 75%,transparent);}
</style>
</head>

<script>
/* Индикатор загрузки: семь фигур с одинаковым числом точек,
   чтобы браузер плавно перетекал из одной в другую. */
function m3LoaderPaths(){
  var N=72, TAU=Math.PI*2;
  function map(f){var a=[],i;for(i=0;i<N;i++){a.push(f(i/N*TAU));}return a;}
  function cookie(n,amp,ph){return map(function(t){var r=1+amp*Math.cos(n*(t-ph));return [r*Math.cos(t),r*Math.sin(t)];});}
  function oval(a,b){return map(function(t){return [a*Math.cos(t),b*Math.sin(t)];});}
  function pill(A,B){var h=A-B;return map(function(t){
    var cx=Math.cos(t),cy=Math.sin(t),lo=0,hi=4,m,x,y,px,k;
    for(k=0;k<32;k++){m=(lo+hi)/2;px=cx*m;y=cy*m;x=Math.min(Math.max(px,-h),h);
      if(Math.sqrt((px-x)*(px-x)+y*y)<=B){lo=m;}else{hi=m;}}
    return [cx*lo,cy*lo];});}
  function poly(n,ph,sm){
    var seg=TAU/n,i,j,k=[],s=0,o=[],p=map(function(t){
      var phi=((t-ph)%seg+seg)%seg-seg/2,r=Math.cos(Math.PI/n)/Math.cos(phi);
      return [r*Math.cos(t),r*Math.sin(t)];});
    for(i=-sm;i<=sm;i++){var w=Math.exp(-Math.pow(i/sm*2,2));k.push(w);s+=w;}
    for(i=0;i<N;i++){var ax=0,ay=0;
      for(j=-sm;j<=sm;j++){var q=p[(i+j+N*2)%N],w2=k[j+sm];ax+=q[0]*w2;ay+=q[1]*w2;}
      o.push([ax/s,ay/s]);}
    return o;}

  var S=[cookie(10,.14,0),cookie(9,.16,.3),poly(5,-Math.PI/2,4),pill(1.35,.72),
         cookie(4,.3,.5),oval(1.22,.86),cookie(7,.21,.2)],i,j,max=0;
  for(i=0;i<S.length;i++){
    var p=S[i],a=0;
    for(j=0;j<N;j++){var q=p[j],r=p[(j+1)%N];a+=q[0]*r[1]-r[0]*q[1];}
    var sc=Math.sqrt(Math.PI/Math.abs(a/2));
    for(j=0;j<N;j++){p[j][0]*=sc;p[j][1]*=sc;
      var d=Math.sqrt(p[j][0]*p[j][0]+p[j][1]*p[j][1]);if(d>max){max=d;}}
  }
  var g=23/max;
  return S.map(function(p){
    var d='M',j;
    for(j=0;j<N;j++){d+=(j?'L':'')+(24+p[j][0]*g).toFixed(1)+' '+(24+p[j][1]*g).toFixed(1);}
    return d+'Z';
  });
}

function m3BuildLoaders(){
  var paths, nodes = document.querySelectorAll('.m3-loader');
  if(!nodes.length) return;
  try{ paths = m3LoaderPaths(); }catch(e){ return; }
  var vals = paths.concat([paths[0]]).join(';'),
      keys = [], splines = [], n = paths.length, i;
  for(i=0;i<=n;i++){ keys.push((i/n).toFixed(4)); }
  for(i=0;i<n;i++){ splines.push('0.4 0 0.2 1'); }

  nodes.forEach(function(svg){
    var p = svg.querySelector('path');
    if(!p) return;
    p.setAttribute('d', paths[0]);
    var a = document.createElementNS('http://www.w3.org/2000/svg','animate');
    a.setAttribute('attributeName','d');
    a.setAttribute('dur','4.9s');
    a.setAttribute('repeatCount','indefinite');
    a.setAttribute('calcMode','spline');
    a.setAttribute('keyTimes', keys.join(';'));
    a.setAttribute('keySplines', splines.join(';'));
    a.setAttribute('values', vals);
    p.appendChild(a);
  });

  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    nodes.forEach(function(svg){ if(svg.pauseAnimations) svg.pauseAnimations(); });
  }
}

function hidePageLoader(){
  var loader = document.getElementById('page-loader');
  document.body.classList.remove('loading');
  if(!loader) return;
  loader.classList.add('hidden');
  setTimeout(function(){ loader.remove(); }, 420);
}

var MAX_RETRIES = 5;

/* Список узлов. Чтобы добавить узел, достаточно добавить строку:
   плитка, счётчик и проверка появятся сами. Порядок строк совпадает
   с порядком плиток. */
var NODES = [
  { id: "de1",   name: "DE 1",   url: "nuxt-vless.duckdns.org" },
  { id: "de2",   name: "DE 2",   url: "nuxt-balancer.duckdns.org" },
  { id: "dedns", name: "DE DNS", url: "nuxt-doh.duckdns.org" },
  { id: "us1",   name: "US 1",   url: "snwy-usa.duckdns.org" },
  { id: "fi1",   name: "FI 1",   url: "snwy-fin.duckdns.org" },
  { id: "nl1",   name: "NL 1",   url: "snwy-neth.duckdns.org" },
  { id: "nl2",   name: "NL 2",   url: "nord-central.duckdns.org" },
  { id: "ch1",   name: "CH 1",   url: "snwy-switz.duckdns.org" },
  { id: "tr1",   name: "TR 1",   url: "snwy-turkey.duckdns.org" },
  { id: "kz1",   name: "KZ 1",   url: "snwy-kaz.duckdns.org" },
  { id: "ru1",   name: "RU 1",   url: "frdm-central.duckdns.org" },
  { id: "ru2",   name: "RU 2",   url: "snwy-central.duckdns.org" },
  { id: "ru3",   name: "RU 3",   url: "lbrts-central.duckdns.org" },
  { id: "ru4",   name: "RU 4",   url: "iron-central.duckdns.org" },
  { id: "ru5",   name: "RU 5",   url: "woof-central.duckdns.org" },
  { id: "ru6",   name: "RU 6",   url: "vld-central.duckdns.org" }
];

var nodeStates = {}, retryCounters = {};
NODES.forEach(function(n){ nodeStates[n.id] = false; retryCounters[n.id] = 0; });

var TOTAL_NODES = NODES.length, doneNodes = 0, upNodes = 0;

/* Рисует плитки узлов по списку NODES. */
function renderNodes(){
  var box = document.getElementById('nodes');
  if(!box) return;
  box.innerHTML = '';
  NODES.forEach(function(n){
    var el = document.createElement('div');
    el.className = 'node';
    el.id = n.id;
    el.innerHTML = '<span class="node-name"><span class="led"></span></span><span class="latency">…</span>';
    el.querySelector('.node-name').appendChild(document.createTextNode(n.name));
    box.appendChild(el);
  });
}

function refreshSummary(){
  var num = document.getElementById('summary-num'),
      txt = document.getElementById('summary-txt');
  num.innerText = upNodes + '/' + TOTAL_NODES;
  if(doneNodes < TOTAL_NODES){
    txt.innerText = 'Проверяем узлы…';
  }else if(upNodes === TOTAL_NODES){
    txt.innerText = 'Все узлы отвечают';
  }else if(upNodes === 0){
    txt.innerText = 'Узлы не отвечают';
  }else{
    txt.innerText = 'Часть узлов недоступна';
  }
}

function checkNodeAttempt(node){
  return new Promise(function(resolve){
    if(!node.el) return resolve(false);
    var start = Date.now(), isCompleted = false, img = new Image();
    var timer = setTimeout(function(){
      if(!isCompleted){ isCompleted = true; img.src = ""; resolve(false); }
    }, 3000);
    img.onload = img.onerror = function(){
      if(isCompleted) return;
      isCompleted = true;
      clearTimeout(timer);
      node.el.classList.add('up');
      node.dot.className = "led on";
      node.lat.innerText = (Date.now() - start) + " мс";
      resolve(true);
    };
    img.src = "https://" + node.url + "/favicon.ico?v=" + start;
  });
}

async function startAggressivePing(){
  var nodes = NODES.map(function(node){
    var el = document.getElementById(node.id);
    return {
      id: node.id, url: node.url, el: el,
      dot: el ? el.querySelector(".led") : null,
      lat: el ? el.querySelector(".latency") : null
    };
  });

  while(true){
    var pendingNodes = nodes.filter(function(n){
      return !nodeStates[n.id] && retryCounters[n.id] < MAX_RETRIES;
    });
    if(pendingNodes.length === 0) break;

    await Promise.all(pendingNodes.map(async function(node){
      var isOnline = await checkNodeAttempt(node);
      if(isOnline){
        nodeStates[node.id] = true;
        upNodes++; doneNodes++;
        refreshSummary();
      }else{
        retryCounters[node.id]++;
        if(retryCounters[node.id] >= MAX_RETRIES && node.el){
          node.el.classList.add('down');
          node.dot.className = "led off";
          node.lat.innerText = "нет ответа";
          doneNodes++;
          refreshSummary();
        }
      }
    }));

    await new Promise(function(r){ setTimeout(r, 1000); });
  }
  refreshSummary();
}

m3BuildLoaders();
renderNodes();
refreshSummary();
document.addEventListener("DOMContentLoaded", startAggressivePing);

if(document.readyState === 'complete'){ hidePageLoader(); }
else{ window.addEventListener('load', hidePageLoader); }
</script>
<script>(function(){var c=document.getElementById('gl');if(!c)return;var x=c.getContext('2d'),bg=document.querySelector('.bg'),cs=getComputedStyle(bg),ln=cs.getPropertyValue('--ln').trim(),ln2=cs.getPropertyValue('--ln2').trim(),W,H,Rr,dpr=Math.min(window.devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);Rr=Math.min(Math.max(W*.62,H*.3),560);}size();addEventListener('resize',size);
var P=[],n=1100,i,g=Math.PI*(3-Math.sqrt(5));for(i=0;i<n;i++){var y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=g*i;P.push([Math.cos(t)*r,y,Math.sin(t)*r]);}

function ll(la,lo){return [Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo)];}
var tilt=.42,rot=0,T=0;
function pr(p,rot){var cy=Math.cos(rot),sy=Math.sin(rot),X=p[0]*cy+p[2]*sy,Z=-p[0]*sy+p[2]*cy,ct=Math.cos(tilt),st=Math.sin(tilt),Y=p[1]*ct-Z*st,Z2=p[1]*st+Z*ct;return [X,Y,Z2];}

for(i=0;i<n;i++){var q=pr(P[i],rot);var a=q[2]>0?.4+.6*q[2]:.12;x.globalAlpha=a;x.beginPath();x.arc(cx+q[0]*Rr,cy-q[1]*Rr,q[2]>0?2.1:1.2,0,7);x.fill();}
x.globalAlpha=.9;x.strokeStyle=ln2;x.lineWidth=2;x.setLineDash([1,7]);x.lineCap='round';
E.forEach(function(e,ei){var a=ll(C[e[0]][0],C[e[0]][1]),b=ll(C[e[1]][0],C[e[1]][1]),d=Math.acos(Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])),pts=[];
for(k=0;k<=40;k++){var t=k/40,s1=Math.sin((1-t)*d)/Math.sin(d),s2=Math.sin(t*d)/Math.sin(d),h=1+.35*Math.sin(Math.PI*t)*Math.min(1,d),p=[(a[0]*s1+b[0]*s2)*h,(a[1]*s1+b[1]*s2)*h,(a[2]*s1+b[2]*s2)*h];pts.push(pr(p,rot));}
x.beginPath();var on=false;pts.forEach(function(q,m){var px=cx+q[0]*Rr,py=cy-q[1]*Rr;if(q[2]>-.1){on?x.lineTo(px,py):x.moveTo(px,py);on=true;}else on=false;});x.stroke();
var tt=((T*.12+ei*.37)%1),m=Math.floor(tt*40),q=pts[m];if(q&&q[2]>-.1){x.setLineDash([]);x.globalAlpha=1;x.fillStyle=ln2;x.beginPath();x.arc(cx+q[0]*Rr,cy-q[1]*Rr,5,0,7);x.fill();x.fillStyle=ln;x.setLineDash([1,7]);x.globalAlpha=.9;}});
x.setLineDash([]);C.forEach(function(p){var q=pr(ll(p[0],p[1]),rot);if(q[2]>0){x.globalAlpha=1;x.fillStyle=ln2;x.beginPath();x.arc(cx+q[0]*Rr,cy-q[1]*Rr,6.5,0,7);x.fill();x.fillStyle=ln;}});
x.globalAlpha=1;}
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){T+=.004;rot+=.000875;frame();requestAnimationFrame(loop);}
if(reduce){rot=.6;frame();}else loop();})();</script>
