<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<!-- Без этого атрибута страница входа всегда светлая: токены темы
		     объявлены как ":root, [data-bs-theme='light']{...}" — :root
		     матчится всегда, а "[data-bs-theme='dark']" не сработает, если
		     атрибута нет вовсе. Этот шаблон отдельный от base.html и раньше
		     никак не читал сохранённую тему. -->
		<script>
			(function(){
				try {
					var saved = localStorage.getItem('ui_theme');
					document.documentElement.setAttribute('data-bs-theme', (saved === 'light' || saved === 'dark') ? saved : 'dark');
				} catch (e) {
					document.documentElement.setAttribute('data-bs-theme', 'dark');
				}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Вход в Панель управления</title>
		<meta name="csrf-token" content="{{ csrf_token() }}" />
		<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml" />
		<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}" />
		<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}" />
		<link rel="mask-icon" href="{{ url_for('static', filename='img/safari-pinned-tab.svg') }}" color="#344DDB" />
		<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}" />
		<meta name="theme-color" content="#FBF8FF" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)" />
		<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

		<!-- Material 3 Expressive -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300..800&display=swap" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-25..0&icon_names=visibility,visibility_off&display=block" />
		<link rel="stylesheet" href="{{ url_for('static', filename='css/m3-expressive.css') }}" />
		<style>
			.login-page{
				background:var(--m3-surface);
				display:flex;align-items:center;justify-content:center;
				min-height:100vh;min-height:100dvh;padding:24px;
			}
			.login-container{
				position:relative;z-index:1;
				width:100%;max-width:400px;
				border:none !important;
				border-radius:var(--m3-r-xxl) !important;
				padding:34px 30px !important;
				box-shadow:0 24px 64px rgba(0,0,0,.18) !important;
			}
			.login-container h1{
				font-size:1.9rem;font-weight:800;letter-spacing:-.04em;
				text-align:left !important;margin:0 0 26px !important;
				color:var(--m3-on-surface);
			}
			.login-container .form-group{margin-bottom:16px;}
			.login-container label{
				display:block;
				font-size:.62rem;font-weight:500;letter-spacing:.1em;
				text-transform:uppercase;color:var(--m3-on-surface-variant);
				margin-bottom:7px;
			}
			.login-container input[type="text"],
			.login-container input[type="password"]{
				width:100%;
				background:var(--m3-surface-container-high);
				border:1px solid transparent;
				border-radius:var(--m3-r-m);
				color:var(--m3-on-surface);
				font-family:inherit;font-size:.82rem;font-weight:300;
				padding:13px 16px;outline:none;
				transition:border-color var(--m3-dur-short) var(--m3-ease-emph);
			}
			.login-container input[type="text"]:focus,
			.login-container input[type="password"]:focus{
				border-color:var(--m3-primary);
				box-shadow:0 0 0 3px color-mix(in oklab, var(--m3-primary) 22%, transparent);
			}
			.password-wrapper{position:relative;}
			.toggle-password{
				position:absolute;right:8px;bottom:6px;
				width:38px;height:38px;
				display:grid;place-items:center;
				background:transparent;border:none;cursor:pointer;
				border-radius:var(--m3-r-full);
				color:var(--m3-on-surface-variant);
				transition:background var(--m3-dur-short) var(--m3-ease-emph);
			}
			.toggle-password:hover{background:var(--m3-surface-container-highest);}
			.toggle-password svg{width:20px;height:20px;}
			.login-container .button{
				width:100%;
				background:var(--m3-primary);color:var(--m3-on-primary);
				border:none;cursor:pointer;
				border-radius:var(--m3-r-full);
				font-family:inherit;font-size:.82rem;font-weight:500;
				padding:15px 24px;
				transition:border-radius var(--m3-dur-med) var(--m3-ease-spring),
				           transform var(--m3-dur-short) var(--m3-ease-emph),
				           filter var(--m3-dur-short) var(--m3-ease-emph);
			}
			.login-container .button:hover{filter:brightness(1.08);}
			.login-container .button:active{border-radius:var(--m3-r-m);transform:scale(.96);}
			.login-container .form-group label[style]{
				text-transform:none;letter-spacing:0;font-size:.74rem;font-weight:300;
				color:var(--m3-on-surface);margin:0;
			}
			#remember_me{
				width:1.15em;height:1.15em;accent-color:var(--m3-primary);cursor:pointer;
			}
			.flash{
				border-radius:var(--m3-r-l);padding:13px 16px;margin-bottom:16px;
				font-size:.74rem;font-weight:300;
				color:var(--m3-on-surface);
			}
			.flash-danger,.flash-error{color:var(--m3-on-error-container);}
			.flash-success{color:var(--m3-on-tertiary-container);}
			.flash-warning{color:var(--m3-on-amber-container);}
		</style>
	</head>
	<body class="login-page">
		<!-- Фон: глобус из точек (static/js/dotglobe.js), поверх него слой 50% -->
		<div class="bg" aria-hidden="true"><canvas id="gl" draggable="false"></canvas></div>
		<div class="login-container">
			<h1>Вход в панель</h1>

			{% with messages = get_flashed_messages(with_categories=true) %} {% if
			messages %} {% for category, message in messages %}
			<div class="flash flash-{{ category }}">{{ message }}</div>
			{% endfor %} {% endif %} {% endwith %}

			<form method="post">
				<input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
				<div class="form-group">
					<label for="username">Логин:</label>
					<input type="text" id="username" name="username" required />
				</div>
				<div class="form-group password-wrapper">
					<label for="password">Пароль:</label>
					<input type="password" id="password" name="password" required />
					<button type="button" id="toggle-login-pass" class="toggle-password" aria-label="Показать пароль" title="Показать пароль">
						<span class="msym" id="pass-icon">visibility</span>
					</button>
				</div>
				<div class="form-group" style="display:flex;align-items:center;gap:10px;justify-content:space-between;margin:10px 0 16px;">
					<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
						<input type="checkbox" id="remember_me" />
						<span>Запомнить меня</span>
					</label>
				</div>
				<button type="submit" class="button button-primary" style="width: 100%">
					Войти
				</button>
			</form>
		</div>
	<script src="{{ url_for('static', filename='js/dotglobe.js') }}"></script>
	<script>
		// Блокируем копирование/сохранение через UI только на странице логина
		(() => {
			const prevent = (e) => e.preventDefault();
			const canvas = document.getElementById('gl');
			document.addEventListener('contextmenu', prevent, { passive: false });
			document.addEventListener('copy', prevent, { passive: false });
			if (canvas) {
				canvas.addEventListener('dragstart', prevent, { passive: false });
				canvas.addEventListener('mousedown', prevent, { passive: false });
			}
		})();

		// Переключатель видимости пароля на странице логина
		(function(){
			const btn = document.getElementById('toggle-login-pass');
			const input = document.getElementById('password');
			if (!btn || !input) return;
			btn.addEventListener('click', () => {
				const icon = document.getElementById('pass-icon');
				const show = input.type === 'password';
				input.type = show ? 'text' : 'password';
				btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
				btn.title = show ? 'Скрыть пароль' : 'Показать пароль';
				if (icon) icon.textContent = show ? 'visibility_off' : 'visibility';
			});
		})();

		// Запомнить логин (username) локально
		(function(){
			const u = document.getElementById('username');
			const r = document.getElementById('remember_me');
			if (!u || !r) return;
			try {
				const saved = localStorage.getItem('login_username');
				if (saved) { u.value = saved; r.checked = true; }
			} catch(_){}
			// При отправке формы — сохранить/очистить
			u.form?.addEventListener('submit', () => {
				try {
					if (r.checked) localStorage.setItem('login_username', u.value || '');
					else localStorage.removeItem('login_username');
				} catch(_){ }
			});
		})();
	</script>
	</body>
</html>
